services:
  - type: web
    name: medicuida-grupo1-demo
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/joakingg1314/MediCuida-Grupo1
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    envVars:
      - key: MEDICUIDA_HOST
        value: 0.0.0.0
      - key: MEDICUIDA_NO_BROWSER
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: medicuida-grupo1-datos-demo
          property: connectionString

databases:
  - name: medicuida-grupo1-datos-demo
    databaseName: medicuida_grupo1_datos_demo
    user: medicuida_grupo1_datos_demo_user
    postgresMajorVersion: "17"
    plan: free
    region: oregon
